<!doctype html><html><head><meta charset="utf-8"></head><body><pre id="out"></pre>
<script type="module">
import { createTunnels } from "./src/erosion/exterior/tunnels.js";
const out = document.getElementById("out");
const log = (t) => (out.textContent += t + "\n");
try {
  // 50 x 40 m block, 40 m tall, on a 1 m height grid, with 20 m of margin
  const nx = 90, nz = 80, h0 = new Float32Array(nx * nz);
  for (let j = 20; j < 60; j++) for (let i = 20; i < 70; i++) h0[j * nx + i] = 40;
  const form = { nx, nz, cx: 1, cz: 1, x0: -45, z0: -40, h0, heights: h0, top: 40, version: 0,
    heightAt: (x, z) => { const i = Math.floor(x + 45), j = Math.floor(z + 40); return i < 0 || j < 0 || i >= nx || j >= nz ? 0 : h0[j * nx + i]; } };
  const dir = [Math.cos(0.3), Math.sin(0.3)]; // wind a little off the x axis
  const t = createTunnels(form);
  log(`voxels ${t.vox.nx}x${t.vox.nz}x${t.vox.ny} of ${t.vox.c.toFixed(2)} m`);
  log("pilot opened " + t.seedPilot(dir));
  let t0 = performance.now();
  for (let r = 0; r < 40; r++) {
    const f = await t.solve(dir, { tol: Number(new URLSearchParams(location.search).get("tol") ?? 2e-4), maxIter: Number(new URLSearchParams(location.search).get("it") ?? 500) });
    const sp = t.tunnelSpeed();
    const opened = t.erode(1);
    log(`round ${r}: iters ${f.iterations}${f.converged ? "" : "*"}  tunnel speed max ${sp.max.toFixed(2)} mean ${sp.mean.toFixed(2)}  carved ${t.carved}  opened ${opened}  ${Math.round(performance.now() - t0)} ms`);
    t0 = performance.now();
    if (!opened && r > 3) break;
  }
} catch (e) { log("FAILED " + (e.stack || e)); }
log("done");
</script></body></html>
