<!doctype html>
<html><body><pre id="out">running</pre>
<script type="module">
const base = "http://localhost:8000/src/erosion/";
const { createTunnels, STOREY } = await import(base + "exterior/tunnels.js");
const out = document.getElementById("out");
const post = async (text) => { try { await fetch("http://127.0.0.1:8002/r", { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain" }, body: text }); } catch (e) {} };
const S = STOREY;
const q = new URLSearchParams(location.search);
const angles = (q.get("angles") || "0,10,20,30,45").split(",").map(Number);
let log = "";
for (const deg of angles) {
  let line = `\n### box 60x36 m, 7 storeys, rotated ${deg} degrees\n`;
  try {
    const a = (deg * Math.PI) / 180, W = 110, D = 110, cell = 1, margin = 10, nx = W + 2 * margin, nz = D + 2 * margin, x0 = -margin, z0 = -margin;
    const h0 = new Float32Array(nx * nz);
    let top = 0;
    for (let j = 0; j < nz; j++) for (let i = 0; i < nx; i++) {
      const x = x0 + (i + 0.5) * cell - 55, z = z0 + (j + 0.5) * cell - 55;
      const u = x * Math.cos(a) + z * Math.sin(a), v = -x * Math.sin(a) + z * Math.cos(a);
      const h = Math.abs(u) < 30 && Math.abs(v) < 18 ? 7 * S : 0;
      h0[j * nx + i] = h; top = Math.max(top, h);
    }
    const form = { nx, nz, cx: cell, cz: cell, x0, z0, top, h0, heights: Float32Array.from(h0), heat: new Float32Array(nx * nz), wear: new Float32Array(nx * nz), version: 0 };
    form.heightAt = (x, z) => { const i = Math.floor((x - x0) / cell), j = Math.floor((z - z0) / cell); return i < 0 || j < 0 || i >= nx || j >= nz ? 0 : form.heights[j * nx + i]; };
    const t = createTunnels(form, {});
    t.setBuoyancy(0.3); t.setObstacles([]); t.setWind([1, 0]); t.setWindSet([{ dir: [1, 0], weight: 1 }]);
    const t0 = performance.now();
    while (!t.done && (performance.now() - t0) / 1000 < 90) await t.grow(0.08);
    line += `tubes ${t.network().edges.length}, done ${t.done}, openings ${t.openings().length}\n`;
    line += `debug ${JSON.stringify(t.ductDebug)}\n`;
  } catch (e) { line += "ERROR " + e.stack + "\n"; }
  log += line; await post(line);
}
out.textContent = log;
await post("\nALLDONE\n");
document.title = "done";
</script></body></html>
