<!doctype html>
<html><head><style>html,body{margin:0;background:#dfe3e6}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script></head>
<body><div id="host" style="position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden"></div><pre id="out">running</pre>
<script type="module">
import * as THREE from "three";
{ const doc = new DOMParser().parseFromString(await (await fetch("http://localhost:8000/index.html")).text(), "text/html"); doc.querySelectorAll("script").forEach((s) => s.remove()); document.getElementById("host").innerHTML = doc.body.innerHTML; }
const base = "http://localhost:8000/src/erosion/";
const { planCirculation } = await import(base + "circulation/rules.js");
const { createCirculationView } = await import(base + "circulation/view.js");
const { createSkinShell } = await import(base + "exterior/skinShell.js");
const post = async (text) => { try { await fetch("http://127.0.0.1:8002/r", { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain" }, body: text }); } catch (e) {} };
let log = ""; var shots = [];
try {
  const d = await (await fetch("http://localhost:8000/_scratch_snap.json")).json();
  const s = d.site, Hh = d.heights;
  s.heightAt = (x, z) => { const i = Math.floor((x - Hh.x0) / Hh.step), j = Math.floor((z - Hh.z0) / Hh.step); return i < 0 || j < 0 || i >= Hh.nx || j >= Hh.nz ? 0 : Hh.h[j * Hh.nx + i]; };
  const plan = planCirculation(s, d.settings);
  // a stand-in for the tunnels, from the snapshot's graph (what the skin reads of them)
  const g = s.graph;
  const edges = g.edges.map((e) => ({ a: g.nodes[e.a], b: g.nodes[e.b], r: e.r }));
  const WALL_OUT = 1.2, found = new Map();
  for (const e of edges) for (const nd of [e.a, e.b]) { if (!nd.wall || nd.wx === undefined) continue; const o = found.get(nd); if (!o || e.r > o.r) found.set(nd, { x: nd.x - nd.wx * WALL_OUT, y: nd.y, z: nd.z - nd.wz * WALL_OUT, nx: nd.wx, nz: nd.wz, r: e.r }); }
  const tunnels = { id: 1, version: 1, openings: () => [...found.values()], massBox: s.box, network: () => ({ nodes: g.nodes, edges }), heightAt: s.heightAt };
  const shell = createSkinShell();
  const gen = shell.build(tunnels, 0); let r; while (!(r = gen.next()).done);
  const built = r.value;
  log += `openings ${found.size}; skin tris ${built.skin.position.length / 9}, wall tris ${built.wall.position.length / 9}\n`;
  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setSize(900, 700);
  document.body.appendChild(renderer.domElement);
  const geo = (q) => { const o = new THREE.BufferGeometry(); o.setAttribute("position", new THREE.Float32BufferAttribute(q.position, 3)); o.setAttribute("normal", new THREE.Float32BufferAttribute(q.normal, 3)); return o; };
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xe9e6df);
  scene.add(new THREE.HemisphereLight(0xffffff, 0xb8b2a6, 0.8));
  const sun = new THREE.DirectionalLight(0xffffff, 1.7); sun.position.set(30, 70, 90); scene.add(sun);
  const mat = new THREE.MeshLambertMaterial({ color: 0xd9a58c, side: THREE.DoubleSide });
  const model = new THREE.Group(); scene.add(model);
  model.add(new THREE.Mesh(geo(built.skin), mat), new THREE.Mesh(geo(built.wall), mat));
  const view = createCirculationView();
  view.update(model, plan, "k", true);
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(500, 500).rotateX(-Math.PI / 2), new THREE.MeshLambertMaterial({ color: 0xd9d4c8 })); ground.position.y = -0.05; scene.add(ground);
  const cam = new THREE.PerspectiveCamera(32, 900 / 700, 1, 700);
  const b = s.box;
  for (const [name, pos, look] of [["south", [0, 30, b.z1 + 95], [0, 26, b.z1]], ["north", [0, 30, b.z0 - 95], [0, 26, b.z0]]]) {
    cam.position.set(...pos); cam.lookAt(...look); renderer.render(scene, cam);
    shots.push([`scene_${name}`, renderer.domElement.toDataURL("image/png")]);
  }
} catch (e) { log += "ERROR " + e.stack; }
for (const [label, url] of shots) await post("SHOT:" + label + ":" + url);
await post("LOG:" + log);
</script></body></html>
